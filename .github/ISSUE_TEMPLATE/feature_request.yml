name: "✨ Feature request / اقتراح ميزة"
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve? / ما المشكلة التي تحلها؟
      description: Describe the need first, then the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / الحل المقترح
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / بدائل
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself / أرغب في تنفيذها بنفسي
