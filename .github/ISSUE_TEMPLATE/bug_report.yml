name: "🐞 Bug report / بلاغ عن مشكلة"
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in Arabic or English.
        شكرًا للإبلاغ! يمكنك الكتابة بالعربية أو الإنجليزية.
  - type: textarea
    id: what
    attributes:
      label: What happened? / ماذا حدث؟
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / خطوات التكرار
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / السلوك المتوقع
  - type: input
    id: version
    attributes:
      label: App version / إصدار التطبيق
      description: Settings → About
      placeholder: "2.0.2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android version / الجهاز وإصدار أندرويد
      placeholder: "Samsung A54, Android 14"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs / صور أو سجلات
      description: Drag images here. For crashes, `adb logcat` output helps a lot.
