name: mongez
description: "A cheerful todo app focused on planning tomorrow."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  home_widget: ^0.9.0
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.10.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
