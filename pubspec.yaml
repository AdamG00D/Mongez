name: mongez
description: "Mongez - plan your day, track goals and screen time."
publish_to: 'none'
version: 2.0.1+3

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  home_widget: ^0.9.0
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^5.0.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Variable.ttf


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon_background.png"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon_monochrome.png"
